{{- $hosts := prepend .Values.aliases .Values.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- with .Values.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  # one certificate per name, so a name whose DNS lags at the switch does not hold back the others
  tls:
    {{- range $hosts }}
    - hosts:
        - {{ . | quote }}
      {{- if $.Values.tls.clusterIssuer }}
      secretName: {{ $.Release.Name }}-tls-{{ . | replace "." "-" }}
      {{- end }}
    {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: 80
    {{- end }}
