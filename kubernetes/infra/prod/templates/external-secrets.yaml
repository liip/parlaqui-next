{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  annotations:
    # Materialise the Secret before the Deployment that reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gitlab-external-secrets-store
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    {{- range $envName, $gitlabVariable := .Values.externalSecrets.gitlabVariables }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $gitlabVariable }}
    {{- end }}
{{- end }}
