{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-external-secrets-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    gitlab:
      auth:
        SecretRef:
          accessToken:
            key: accessToken
            name: {{ .Values.externalSecrets.gitlabAccessTokenSecret }}
      projectID: '{{ .Values.externalSecrets.gitlabProjectID }}'
      url: {{ .Values.externalSecrets.gitlabUrl }}
{{- end }}
