---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # The chart's `host`; the verify job checks the release there.
  PRODUCTION_URL: https://parlaqui.ch

include:
  - component: $CI_SERVER_FQDN/components/containers-builder/build@0.8.0
    inputs:
      as: Build image
      image-name: app
      # --format docker keeps the Dockerfile's HEALTHCHECK, which the OCI format drops
      build-args: |
        --format docker
      # Shell defaults must be expanded here, not in the component's BUILD_ARGS CI variable.
      before-script:
        - export BUILD_ARGS="${BUILD_ARGS} --build-arg VCS_BRANCH_SHA=${CI_COMMIT_SHA}"
      kubernetes-ephemeral-storage: 4Gi
      stage: build
      rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - deploy

#### Test ####
# Deliberately no `environment:`: this job must stay out of every deployment's reach. Every test
# file opens its own database in memory, so the job needs no service and reaches no database.
Test:
  stage: test
  tags: [docker]
  image: node:22-slim
  timeout: 10min
  interruptible: true
  script:
    # npm ci would compile better-sqlite3, which ships its binaries prebuilt; prepare is skipped too
    - npm ci --ignore-scripts
    - npx svelte-kit sync
    - npm run lint
    - npm run check
    - npx vitest run

Helm lint:
  stage: test
  tags: [docker]
  image:
    name: docker.io/alpine/helm:3.22.1
    entrypoint: ['']
  script:
    - helm lint --strict kubernetes/infra/prod
    - helm template parlaqui kubernetes/infra/prod > /dev/null
  rules:
    - changes:
        - kubernetes/**/*
  interruptible: true

#### Deploy ####
# GitOps: points kubernetes/infra/prod at this tag's image on main, and ArgoCD rolls it out.
# Rolling back = "Re-deploy" an older deployment from Operate > Environments > production.
deploy:production:
  stage: deploy
  tags: [docker]
  image: docker.io/alpine:3.22
  needs:
    - Test
    - Build image
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  environment:
    name: production
    url: $PRODUCTION_URL
  resource_group: production
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache git
    - |
      git clone --depth 1 --branch "$CI_DEFAULT_BRANCH" "https://deploy-bot:${GITOPS_PUSH_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git" gitops
      cd gitops

      sed -i -E "/^image:/,/^[^ ]/ s|^(  tag: ).*|\1${CI_COMMIT_REF_SLUG}|" kubernetes/infra/prod/values.yaml
      sed -i -E "s|^appVersion: .*|appVersion: \"${CI_COMMIT_TAG#v}\"|" kubernetes/infra/prod/Chart.yaml
      grep -q "^  tag: ${CI_COMMIT_REF_SLUG}\$" kubernetes/infra/prod/values.yaml

      if git diff --quiet; then
        echo "Production already points at ${CI_COMMIT_TAG}."
        exit 0
      fi

      git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" \
        commit -am "deploy(prod): ${CI_COMMIT_TAG} [skip ci]"
      git push origin "HEAD:${CI_DEFAULT_BRANCH}" \
        || (git pull --rebase origin "$CI_DEFAULT_BRANCH" && git push origin "HEAD:${CI_DEFAULT_BRANCH}")

# Waits for ArgoCD to sync and the new pod to serve the tagged commit.
verify:production:
  stage: deploy
  tags: [docker]
  image: docker.io/alpine:3.22
  needs:
    - deploy:production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  timeout: 15m
  variables:
    GIT_STRATEGY: none
  script:
    - |
      for attempt in $(seq 60); do
        served="$(wget -qO- "${PRODUCTION_URL}/vcs_branch_sha" || true)"
        if [ "$served" = "$CI_COMMIT_SHA" ]; then
          echo "Production serves ${CI_COMMIT_TAG}."
          exit 0
        fi
        echo "Production serves '${served}', waiting for ${CI_COMMIT_SHA}..."
        sleep 10
      done
      exit 1
